<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="wedge"><path d="M28 90 Q25 90 26.5 87 L70 42 Q72.5 39.5 75 42 L106 87 Q107.5 90 104 90 Z"/></clipPath>
    <clipPath id="lens"><circle cx="48" cy="62" r="18"/></clipPath>
  </defs>

  <!-- plate -->
  <rect x="18" y="90" width="88" height="6" rx="3" fill="#E7DED4"/>
  <rect x="18" y="90" width="88" height="2.5" rx="1.25" fill="#F2EBE3"/>

  <!-- cake slice: front face of a wedge, layered bottom-up -->
  <g clip-path="url(#wedge)">
    <rect x="24" y="30" width="86" height="62" fill="#FBEEDC"/>
    <rect x="24" y="78" width="86" height="12" fill="#EFDFC6"/>
    <rect x="24" y="72" width="86" height="6"  fill="#FFFCF6"/>
    <rect x="24" y="58" width="86" height="14" fill="#FBEEDC"/>
    <rect x="24" y="52" width="86" height="6"  fill="#F6C7D4"/>
    <rect x="24" y="30" width="86" height="22" fill="#FFF7EA"/>
  </g>
  <path d="M28 90 Q25 90 26.5 87 L70 42 Q72.5 39.5 75 42 L106 87 Q107.5 90 104 90 Z"
        fill="none" stroke="#E4D2B8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- strawberry on the peak -->
  <path d="M72.5 29 c4.2 0 7.2 3 7.2 6.2 0 4-4.2 7.2-7.2 8.8 -3-1.6-7.2-4.8-7.2-8.8 0-3.2 3-6.2 7.2-6.2 z" fill="#EE8DA3"/>
  <circle cx="70.1" cy="35.4" r=".9" fill="#FFF1F4"/><circle cx="74.9" cy="37.4" r=".9" fill="#FFF1F4"/>
  <path d="M72.5 29.6 c-2.6-3.4-6.6-3.8-8.6-1.8 2.8 0 4.8 1.2 5.6 3.2 1-2 3-1.4 3-1.4 z" fill="#A6C9A4"/>

  <!-- magnifier -->
  <path d="M36 76 L26 89" stroke="#7F84D4" stroke-width="9" stroke-linecap="round"/>
  <path d="M36 76 L26 89" stroke="#A6AAE6" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="48" cy="62" r="18" fill="#DDEEF7" fill-opacity="0.85"/>
  <g clip-path="url(#lens)">
    <rect x="33" y="54" width="22" height="3.6" rx="1.8" fill="#7F84D4" fill-opacity="0.5"/>
    <rect x="58" y="54" width="9"  height="3.6" rx="1.8" fill="#7F84D4" fill-opacity="0.5"/>
    <rect x="33" y="61" width="16" height="3.6" rx="1.8" fill="#CE3F63"/>
    <rect x="52" y="61" width="11" height="3.6" rx="1.8" fill="#B07018"/>
    <rect x="33" y="68" width="12" height="3.6" rx="1.8" fill="#0B87A8"/>
    <rect x="48" y="68" width="14" height="3.6" rx="1.8" fill="#7F84D4" fill-opacity="0.5"/>
  </g>
  <circle cx="48" cy="62" r="18" fill="none" stroke="#7F84D4" stroke-width="5.5"/>
  <path d="M39 53 a12 12 0 0 1 8-3.6" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.92"/>
